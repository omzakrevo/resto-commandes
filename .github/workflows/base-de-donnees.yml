name: Installer / mettre à jour la base

# Lancement manuel uniquement (onglet Actions > ce workflow > Run workflow).
# Applique supabase/schema.sql sur ton Supabase auto-hébergé.
# Le script est rejouable sans casser les données existantes.
#
# Secret à créer (Settings > Secrets and variables > Actions > Secrets) :
#   DATABASE_URL  ex. postgresql://postgres:MOT_DE_PASSE@IP_DU_VPS:5432/postgres
# Le port Postgres du VPS doit être joignable depuis Internet. Sinon, colle
# simplement schema.sql dans le SQL Editor de ton Supabase Studio.

on:
  workflow_dispatch:

jobs:
  migrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer le schéma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL manquant."
            exit 1
          fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
