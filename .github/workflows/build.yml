name: Compiler et publier

# À chaque push sur main :
#  1. analyse du code Flutter
#  2. site GitHub Pages : page client (racine) + app tablette/livreur version web (/app/)
#  3. APK Android publié dans Releases (tag "latest")
#
# Variables du dépôt à créer (Settings > Secrets and variables > Actions > Variables) :
#   SUPABASE_URL  ex. https://supabase.mondomaine.com   (HTTPS obligatoire)
#   SUPABASE_KEY  la clé ANON_KEY de ton Supabase auto-hébergé

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Variables SUPABASE_URL / SUPABASE_KEY absentes : le site sera publié en mode démonstration."
          fi
          case "$SUPABASE_URL" in http://*) echo "::warning::SUPABASE_URL est en http:// — les navigateurs et Android bloqueront les appels. Utilise https://";; esac

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      - name: Compiler l'app web (tablette / livreur)
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/app/" \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://VOTRE-SUPABASE.exemple.com}" \
            --dart-define=SUPABASE_KEY="${SUPABASE_KEY:-VOTRE_CLE_ANON}"

      - name: Assembler le site
        working-directory: .
        run: |
          mkdir -p site/app
          cp -r app/build/web/* site/app/
          cp web_client/index.html site/index.html
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            python3 - <<'PY'
          import os
          p = 'site/index.html'
          s = open(p, encoding='utf-8').read()
          s = s.replace("'https://VOTRE-PROJET.supabase.co'", repr(os.environ['SUPABASE_URL'].rstrip('/')))
          s = s.replace("'VOTRE_CLE_ANON'", repr(os.environ['SUPABASE_KEY']))
          open(p, 'w', encoding='utf-8').write(s)
          PY
          fi
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compiler l'APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://VOTRE-SUPABASE.exemple.com}" \
            --dart-define=SUPABASE_KEY="${SUPABASE_KEY:-VOTRE_CLE_ANON}"
          cp build/app/outputs/flutter-apk/app-release.apk ../resto-commandes.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version
          make_latest: true
          body: |
            APK unique pour la tablette (compte admin/caisse) et les livreurs (compte livreur).
            Compilé depuis le commit ${{ github.sha }}.
          files: resto-commandes.apk
